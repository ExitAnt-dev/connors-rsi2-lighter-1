services:
  - type: worker
    name: exitant-connors-rsi2-lighter
    runtime: image
    plan: starter
    region: frankfurt   # Lighter refuses writes from US addresses (20558 restricted jurisdiction) — never a US region

    numInstances: 1
    image:
      url: docker.io/exitant/exitant-connors-rsi2-lighter:1
    disk:
      name: connors-rsi2-lighter-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LIGHTER_WALLET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
