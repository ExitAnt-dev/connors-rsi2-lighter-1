services:
  - type: worker
    name: exitant-connors-rsi2-lighter
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    image:
      url: docker.io/exitant/exitant-connors-rsi2-lighter:1
    disk:
      name: connors-rsi2-lighter-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LIGHTER_API_KEY
        sync: false
      - key: LIGHTER_ACCOUNT_INDEX
        sync: false
      - key: LIGHTER_API_KEY_INDEX
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
